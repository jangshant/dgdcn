[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Pass container environment (DB credentials etc.) through to settings.php.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
