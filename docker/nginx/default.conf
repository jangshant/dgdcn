# Drupal 11 + CiviCRM.
#
# PHP is only executed for Drupal's front controllers; everything else is
# served as a static file or denied. CiviCRM's runtime data (logs, compiled
# templates, uploads) is kept outside the web root on the private volume, and
# is denied here too in case it ever ends up under files/.

server_tokens off;

upstream php {
    server app:9000;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/web;
    index index.php;

    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
    location ^~ /.well-known/ { try_files $uri =404; }

    # Hidden files (.git, .env, .htaccess ...) and source/config files.
    location ~ (^|/)\. { return 404; }
    location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|tpl|xtmpl|yml|yaml|lock|dist|bak|orig|save|swp|log|tpl\.php)$ { return 404; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|web\.config|civicrm\.settings\.php|settings(\.local)?\.php)$ { return 404; }

    # CiviCRM runtime directories must never be web-readable.
    location ~ ^/sites/[^/]+/files/civicrm/(ConfigAndLog|custom|persist|templates_c|upload)(/|$) { return 404; }

    # User-writable directories: serve static assets only, never PHP.
    location ~ ^/(sites/[^/]+/files|extensions|libraries)/.*\.(php|phar|phtml|pl|py|cgi)$ { return 404; }

    # Drupal-generated image styles and private files go through Drupal.
    location ~ ^/sites/[^/]+/files/styles/ { try_files $uri /index.php?$query_string; }
    location ~ ^(/[a-z\-]+)?/system/files/ { try_files $uri /index.php?$query_string; }

    location ~* \.(css|js|mjs|map|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        log_not_found off;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # The only PHP entry points.
    location ~ ^/(index|update)\.php(/|$)|^/core/(install|rebuild|authorize)\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors on;
        fastcgi_read_timeout 120s;
        fastcgi_pass php;
    }

    location ~ \.php(/|$) { return 404; }
}
